descMiningContent=Pokémon Mining:\n  Shift+right-click a rock or ore block with a Pokémon that knows a smash move.\n  A spherical crater explodes from the impact point — widest at center, narrow at edges.\n\n  Lv  0 → Rock Smash  — N=2 crater  (Stone pickaxe)\n  Lv 10 → Rock Smash  — N=3 crater\n  Lv 20 → Brick Break — N=3 crater  (Iron pickaxe)\n  Lv 30 → Brick Break — N=4 crater\n  Lv 40 → Superpower  — N=5 crater  (Diamond pickaxe)\n\n  Scoring is based on block hardness — harder blocks earn more XP.\n\n  Tip: Mine deep underground (below Y=0) for the danger bonus.\n        Use /pokeskill mining list to see what can spawn here.

