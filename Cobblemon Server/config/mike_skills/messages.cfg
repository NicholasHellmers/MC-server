descInsomniaContent=Pokémon Insomnia:\n  Stay awake! The longer you resist sleep, the stronger the spirits become.\n\n  Ghosts and undead will hunt you when you are in the dark at night.\n  Stay in well-lit areas to remain safe, even outdoors.\n\n  3+ days awake → Ghosts begin spawning.\n  5+ days awake → Stronger ghosts. Enemies gain +HP and +Damage.\n  7+ days awake → Rare haunted species emerge.\n  10+ days awake → Legendary ghost-types and brutal combat challenges.\n\n  Your XP multiplier and Score scales with your days without sleep.\n  Each encounter becomes an opportunity for massive XP drops.\n  If you wish to retreat, the ghosts will eventually fade or burn,\n  but sleeping or dying deducts XP.\n\n  Tip: Use /pokeinsomnia list to see what haunts you tonight.
