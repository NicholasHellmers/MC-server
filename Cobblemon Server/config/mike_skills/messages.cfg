// ── /desc content ────────────────────────────────────────────────────
descFishingContent=Pokémon Fishing:\n  Use any fishing rod — no party move required.\n  Your fishing level and water body size affect encounter quality.\n\n  Larger bodies of water (lake, ocean) unlock rarer Pokémon.\n  Higher fishing level unlocks stronger encounters.\n\n  Tip: Use /pokeskill fishing list to see what can spawn at your location.
descDigContent=Pokémon Digging:\n  Shift+right-click dirt, sand or gravel with a Pokémon that knows a dig move.\n  Higher-tier moves excavate larger areas and earn more XP.\n\n  Lv  0 → Dig         — 2x2 area  (XP x1.0)\n  Lv 20 → Magnitude   — 3x3 area  (XP x1.5)\n  Lv 40 → Bulldoze    — 4x4 area  (XP x2.0)\n  Lv 60 → Earthquake  — 5x5 area  (XP x2.5)\n\n  Tip: Dig deeper and target rare blocks for better encounter chances.\n        Use /pokeskill digging list to see what can spawn here.
descCutContent=Pokémon Wood-Logging:\n  Shift+right-click any log block with a Pokémon that knows a cut move.\n  The connected tree is felled in one strike — more logs = rarer encounters.\n  Curved trunks (acacia) and diagonal growth are fully supported.\n\n  Lv  0 → Cut        — 1×1 straight trunk, up to  20 logs\n  Lv 30 → X-Scissor  — 2×2, curved & diagonal trees, up to  80 logs\n  Lv 50 → Guillotine — any tree, full 18-dir BFS, up to 300 logs\n\n  Tip: Larger trees unlock rarer encounters.\n        Use /pokeskill cutting list to see what can spawn here.

