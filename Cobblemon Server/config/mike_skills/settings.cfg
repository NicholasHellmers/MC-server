# CobblemonMikeSkills - settings.cfg
# Lines starting with # are comments and are ignored.
# Reload in-game: /pokeskill config - Reload settings.cfg

# --- Language ---
# GUI language for all chest-menu text (hub, skill, ladder, compendium).
# Accepted values: en_us, pt_br, zh_cn
# On first run, writes lang.cfg with the chosen language's defaults.
# Changing this after lang.cfg exists only affects newly-appended keys.
language=en_us

# --- General Drops ---
# dropDigBlocks   true  = excavated blocks drop their vanilla loot (ores, gravel, etc.)
#                         in addition to skill rewards.
#                 false = vanilla block drops are suppressed; only skill rewards apply.
dropDigBlocks=true

# dropCutLogs     true  = chopped logs drop their vanilla items (wood, sticks, etc.)
#                         in addition to skill rewards.
#                 false = vanilla log drops are suppressed; only skill rewards apply.
dropCutLogs=true

# dropFishingLoot true  = vanilla fishing loot (fish, treasure, junk) is kept alongside skill rewards.
#                 false = vanilla fishing loot is suppressed; only skill rewards apply.
dropFishingLoot=true

# dropMiningBlocks true  = excavated blocks drop their vanilla loot (ores, stones, etc.)
#                          in addition to skill rewards.
#                  false = vanilla block drops are suppressed; only skill rewards apply.
dropMiningBlocks=true

# allowFishNothing    true  = fishing can return nothing (vanilla empty-reel chance applies)
#                     false = every reel always produces a skill reward
allowFishNothing=true

# --- Auto-Battle ---
# When true, a Cobblemon PvE battle starts immediately when the profession spawns a Pokemon.
# Set false if you want players to initiate battles manually (throw a Poke Ball).
startBattleOnFish=true
startBattleOnDig=true
startBattleOnCut=true
startBattleOnMining=true

# blockSkillsInBattle   true  = dig / cut / mining are blocked while the player is already
#                               in a Cobblemon battle. Shows a warning on the action bar.
#                       false = skills can be triggered during an active battle.
blockSkillsInBattle=true

# --- Dimension Blocklist ---
# Comma-separated list of dimension registry keys where ALL block-breaking and fishing
# skills are completely disabled. Use the full key format: namespace:path
#
# Examples:
#   blockedDimensions=minecraft:overworld
#   blockedDimensions=lobby:spawn,lobby:hub
#   blockedDimensions=minecraft:the_nether,minecraft:the_end
#
# To find your dimension key: stand in the world and run /data get entity @s Dimension
# or check the server's world folder name (maps to "minecraft:<folder>" for vanilla worlds).
# Leave empty (default) to allow skills in every dimension.
blockedDimensions=

# --- Server Performance ---
# maxConcurrentExcavations
#   Maximum number of active dig + mining excavation tasks allowed simultaneously
#   across the entire server. Each excavation breaks up to 25 blocks per server tick;
#   uncapped on a 200-player server this can cause severe TPS drops.
#
#   Recommended: 20 for ~50 players, 30 for ~100 players, 40 for ~200 players.
#   Set to 0 to disable the cap entirely (not recommended on large servers).
#
#   When the cap is reached a new excavation attempt is rejected and the player sees
#   a short action-bar message asking them to wait a moment.
maxConcurrentExcavations=30

# --- Fishing Rod ---
# fishingRodStrength   Base tool-strength value assigned to the common fishing rod.
#                      Range: 25-50. Default: 25.
#                      Higher values slightly raise the average level of spawned Pokemon.
fishingRodStrength=25

# useCommonRod   true  = the standard Minecraft fishing rod triggers encounters
#                false = only the mod custom skill rods trigger encounters
useCommonRod=true

# --- XP Multipliers ---
# Scale the raw XP awarded per action. Minimum value: 0.1
# 1.0 = default pacing | 2.0 = double XP | 0.5 = half XP
fishingXpMultiplier=1.0
diggingXpMultiplier=1.0
cuttingXpMultiplier=1.0
insomniaXpMultiplier=1.0
miningXpMultiplier=1.0

# --- Score Multipliers ---
# Scale the excavation/fishing score used to decide which rarity tier is eligible.
# Higher values make RARE/EPIC groups accessible at lower skill levels. Minimum: 0.1
fishingScoreMultiplier=1.0
diggingScoreMultiplier=1.0
cuttingScoreMultiplier=1.0
insomniaScoreMultiplier=1.0
miningScoreMultiplier=1.0

# --- Water Body (Fishing) ---
# maxWaterCountBonus   Maximum adjacent water blocks counted when applying the
#                      water-size bonus to level and spawn-quality calculations.
#                      Range: 100-300. Default: 200.
#                      Do not change unless you understand the fishing formula.
maxWaterCountBonus=200

# --- Safari Zone ---
# Optional bounding box that activates a dedicated safari spawn table key
# when fishing inside the defined region. Set all values to 0 to disable.
# Format: integer block coordinates (X Y Z for start and end corners).
# Example: startSafariBlockPosX=100 endSafariBlockPosX=200 (with matching Y/Z)
startSafariBlockPosX=0
startSafariBlockPosY=0
startSafariBlockPosZ=0
endSafariBlockPosX=3
endSafariBlockPosY=3
endSafariBlockPosZ=3

# --- Legendary Cooldown ---
# Per-player cooldown in minutes after catching a Legendary Pokemon.
# Each profession has an independent timer. Catching a legendary while fishing
# does NOT affect the digging/cutting/insomnia cooldowns.
# While on cooldown the next legendary roll for that profession is replaced by Magikarp.
# Default: 360 (6 hours). Set to 0 to disable the cooldown for that profession.
fishingLegendaryCooldownMin=360
diggingLegendaryCooldownMin=360
cuttingLegendaryCooldownMin=360
insomniaLegendaryCooldownMin=360
miningLegendaryCooldownMin=360

# --- Storage Backend ---
# storageBackend   nbt     = saves player skill data inside vanilla player NBT (default).
#                           Works for any standalone server, no extra setup required.
#                  mongodb = saves to a MongoDB collection. Use for Bungee/Velocity
#                           networks where players roam across multiple backend servers.
storageBackend=nbt

# mongodbUri        MongoDB connection string. Only used when storageBackend=mongodb.
#                   Example: mongodb://username:password@host:27017
mongodbUri=mongodb://localhost:27017

# mongodbDatabase   Name of the MongoDB database. Only used when storageBackend=mongodb.
#                   Example: mike_skills
mongodbDatabase=mikeskills

# --- Visual and Audio Effects ---
# Three independent event categories, each with an animations toggle and a sounds toggle.
# Set either to false to suppress that category.
#
# action     = dig dust cloud, cut leaf burst, common Pokemon discovery sparkle
# shinyFound = shiny/legendary Pokemon discovery burst (totem flash, thunder crack)
# levelUp    = level-up title screen and chime
actionAnimationsEnabled=true
actionSoundsEnabled=true
shinyFoundAnimationsEnabled=true
shinyFoundSoundsEnabled=true
levelUpAnimationsEnabled=true
levelUpSoundsEnabled=true

# --- Skill Ladder ---
# ladderEnabled   true  = the /ladder command and GUI button are active (default)
#                 false = the feature is hidden server-wide
ladderEnabled=true

# ladderPageSize  Total number of leaderboard entries to load and paginate.
#                 Accepted values: 1-100. Default: 10.
#                 The GUI always shows 10 entries per page; larger sizes add extra pages.
ladderPageSize=10

# spawnBrowserEnabled
#   true  = the Spawn Browser button is available in each profession GUI (default).
#           Players can inspect the full spawn table for their current biome.
#   false = the Spawn Browser button is hidden server-wide.
#           Useful for servers that prefer progressive discovery via the Compendium.
spawnBrowserEnabled=true

# --- Spawn Alert Scopes ---
# Controls where each rarity tier sends its spawn notification (chat message).
# Accepted values:
#   broadcast = server-wide chat message visible to all players
#   nearby    = chat message only to players within nearbyAlertRadius blocks
#   player    = chat message only to the player who triggered the encounter
#   off       = no message sent
shinyAlertScope=broadcast
legendaryAlertScope=broadcast
ultraBeastAlertScope=broadcast

# --- Nearby Alerts ---
# nearbyAlertEnabled   true  = the nearby scope above is active
#                      false = nearby scope behaves like player (no radius broadcast)
nearbyAlertEnabled=true

# nearbyAlertRadius   Radius in blocks for the nearby-spawn alert. Range: 50-500. Default: 100.
nearbyAlertRadius=100

# actionNearbyEnabled   true  = players within nearbyAlertRadius receive chat messages
#                               when another player uses a dig/cut move or finds an item.
#                       false = only the acting player sees the results on the action bar.
actionNearbyEnabled=true

# --- PP Cost Mode ---
# ppCostMode   per_use   = 1 PP deducted per activation regardless of depth or logs (default).
#                          Allows deep excavations and large trees without extra PP cost.
#              per_layer = 1 PP per excavated layer (digging) or per log chopped (cutting).
#                          The action is capped to the move remaining PP before it starts.
ppCostMode=per_use

# cutRequireLeaves   true  = cutting only activates when the targeted log structure has leaves,
#                           distinguishing natural trees from player-placed wood columns (default).
#                   false = any connected log structure triggers cut regardless of leaves.
#                           Use false to also allow cutting dead/curved trees without a canopy.
cutRequireLeaves=true

# cutDestroyLeaves   true  = felled leaves are actively removed when a tree is cut (default).
#                   false = leaves are left in place; vanilla slow-decay handles them over time.
cutDestroyLeaves=true

# dropCutLeaves      true  = destroyed leaves drop their block item (silk touch behaviour).
#                           Only relevant when cutDestroyLeaves is true.
#                   false = leaves are removed silently without dropping items (default).
dropCutLeaves=false

# chanceToFindNothing   Probability (0.0–1.0) that a skill action yields no encounter at all,
#                       checked before the spawn table is consulted.
#                       0.0  = every action resolves the spawn table (no blank rolls).
#                       0.20 = 20% of actions yield nothing (default — slows encounter rate).
#                       1.0  = never find anything (effectively disables all encounters).
chanceToFindNothing=0.2

# miningBrickBreakSilkTouch   true  = the Brick Break move drops blocks as if mined with silk touch.
#                              false = blocks are broken normally and drop their standard loot (default).
miningBrickBreakSilkTouch=false

# blockCountUsesPokemonAttack
#   true  = Pokemon attack stat is added as a bonus to dig depth and cut log count (default).
#           Stronger Pokemon excavate deeper and chop more logs.
#   false = Block count is determined only by move tier and player skill level.
#           All Pokemon with the same move produce identical results.
blockCountUsesPokemonAttack=true

# minReqFriendship   Minimum friendship value (0-255) a Pokemon must have to be eligible
#                    for CUT or DIG actions. Pokemon below this value are skipped during
#                    move selection. Set to 0 to disable (default).
minReqFriendship=0

# friendshipGainOnAction   Friendship points awarded to the Pokemon that performed a
#                          successful CUT or DIG action. Range: 0-255. Default: 1.
#                          Set to 0 to disable.
friendshipGainOnAction=1

# --- Insomnia ---
# preventBattlesWhenHunted   Applies only to battles initiated by tracked insomnia spirits.
#                            false = spirits automatically initiate Cobblemon PvE battles
#                                    when they reach the player (default).
#                            true  = spirits are blocked from starting battles; the player
#                                    can ignore them and continue normal gameplay.
#                            Note: other skill encounters (fishing, digging, mining) are
#                            NOT affected by this flag regardless of its value.
preventBattlesWhenHunted=false

# insomniaSleepBlock   true  = player is physically blocked from entering a bed when
#                             they have not defeated enough spirits (required = days without sleep).
#                      false = sleep is always allowed; the warning is still shown (default).
insomniaSleepBlock=false

# insomniaSleepPenalty true  = sleeping without meeting the daily kill quota applies an XP penalty (default).
#                      false = no penalty is applied; useful if you only want the warning.
insomniaSleepPenalty=true

# insomniaSpawnMaxLightLevel   Block light ceiling for spirit spawning (0-15).
#   Uses block light only (same layer as vanilla hostile mob spawning, 1.18+).
#   Sky light at night is excluded — torch placement gives predictable, consistent protection.
#   Default: 10. A torch covers roughly 4 blocks; beyond that radius spirits can spawn.
#   Set to 15 to allow spirits regardless of lighting. Set to 0 for complete darkness only.
insomniaSpawnMaxLightLevel=10

# insomniaMobKillXp   Flat Insomnia XP for killing a tracked vanilla mob (phantom, zombie, skeleton, etc.).
#   NOT scaled by insomniaXpMultiplier. Set to 0 to disable mob XP.
insomniaMobKillXp=1

# insomniaMobXpMaxLevel   Insomnia level cap for vanilla mob XP. Once the player's Insomnia level
#   reaches this value, killing tracked mobs no longer awards XP (Pokémon spirits are unaffected).
#   Range: 0-100. Default: 10.
insomniaMobXpMaxLevel=10

# --- Tool XP (Manual Block Breaking) ---
# Players below toolXpMaxLevel earn small Dig/Cut XP by breaking blocks manually.
# XP is accumulated fractionally; whole integers are awarded when the threshold crosses.
# After reaching toolXpMaxLevel only Pokemon actions award XP for that skill.
toolXpEnabled=true
# toolXpMaxLevel   Level cap. Range: 1-100. Default: 10.
toolXpMaxLevel=10
# toolXpPerLog        Cutting XP per log broken manually. Default: 0.5 (2 logs = 1 XP).
toolXpPerLog=0.5
# toolXpPerSandDirt   Digging XP per sand/dirt block broken manually. Default: 0.25 (4 blocks = 1 XP).
toolXpPerSandDirt=0.25
# toolXpPerGravel     Digging XP per gravel block broken manually. Default: 0.5 (2 blocks = 1 XP).
toolXpPerGravel=0.5

# Insomnia mob scaling: bonuses accumulate per day without sleep, applied from
# insomniaMinDaysForBuffs onwards. Set a bonus to 0.0 to disable it individually.
#   insomniaBonusHealthPerDay   Extra max health (half-hearts) per sleepless day. Range: 0.0-20.0
#   insomniaBonusDamagePerDay   Extra attack damage per sleepless day.           Range: 0.0-10.0
#   insomniaBonusArmorPerDay    Extra armor points per sleepless day.             Range: 0.0-10.0
#   insomniaMinDaysForBuffs     Sleepless days required before buffs start.       Range: 1-30
insomniaBonusHealthPerDay=2.0
insomniaBonusDamagePerDay=0.5
insomniaBonusArmorPerDay=0.5
insomniaMinDaysForBuffs=3

# --- Dynamic Bonus System ---
# luckyDayEnabled    true  = daily luck XP multipliers are active (1.2x-2.0x, based on UUID + world day hash).
#                    false = luck bonuses are disabled; all players roll no multiplier.
luckyDayEnabled=true

# weeklyThemeEnabled true  = the weekly featured profession earns +30% XP for all players.
#                    false = weekly theme bonus is disabled.
weeklyThemeEnabled=true

# moonPhaseEnabled   true  = full moon raises XP and rare-encounter rates.
#                    false = moon phase has no effect.
moonPhaseEnabled=true

# dailyBriefingEnabled   true  = players receive a daily summary on login (luck, moon, theme, weather).
#                        false = no briefing is sent on login.
dailyBriefingEnabled=true

# --- Compendium ---
# compendiumEnabled   Master switch for the Compendium feature.
#   true  = the Compendium tab is available in every profession GUI and progress is tracked (default).
#   false = the Compendium button is hidden server-wide and no new encounters are recorded.
#           Existing player progress is preserved in storage and restored automatically on re-enable.
#           Useful for servers that do not want the collection mechanic at all.
compendiumEnabled=true

# compendiumSilhouetteEnabled   Controls how undiscovered entries look inside the Compendium.
#   true  = undiscovered entries appear as progressive silhouettes with level / biome hints (default).
#           State 1 (grey pane): player has reached the required skill level but not yet encountered.
#           State 2 (light-grey pane): player has also used the skill in the entry's biome.
#   false = only fully-discovered entries are shown; everything else is hidden ("no spoilers" mode).
#   Only relevant when compendiumEnabled is true.
compendiumSilhouetteEnabled=true

# --- Block Collection Bonus ---
# blockCollectionBonusEnabled   true  = completing a block collection grants a passive XP bonus:
#                                       +5% at 50% completion, +10% at 100%.
#                                       Applies to mining, digging, and cutting only (not fishing).
#                               false = block collection has no XP effect.
blockCollectionBonusEnabled=true

# --- Skill Action Cooldowns ---
# Minimum seconds a player must wait between consecutive activations of each skill.
# Set to 0 to disable the cooldown for that skill entirely.
# Fishing default: 5s | Digging/Cutting/Mining default: 3s | Insomnia default: 30s
#
# For insomnia, this sets the base tick delay between spirit spawn waves
# (dark areas: 1x–2x the cooldown; lit areas: 2x–4x the cooldown).
fishingCooldownSeconds=5
diggingCooldownSeconds=3
cuttingCooldownSeconds=3
miningCooldownSeconds=3
insomniaCooldownSeconds=30
