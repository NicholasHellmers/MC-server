// Lines starting with // are comments and are ignored.
// Reload in-game: /pokeskill config → "Reload settings.cfg"
// ════════════════════════════════════════════════════════════════

// enabled   true = this profession is active and can trigger encounters
//           false = profession is fully disabled server-wide (overrides per-player toggle)
enabled=true

// encounterChanceMultiplier   Global scale on the encounter roll for this profession.
//   Range: 0.1–5.0. Default: 1.0
//   1.0 = default frequency | 2.0 = double encounter rate | 0.5 = half encounter rate
encounterChanceMultiplier=1.0

// ─── Encounter Mood Weights ──────────────────────────────────────
// When an encounter triggers, ONE mood is selected via weighted random from these three.
// Mood controls how the spawned entity behaves toward the player:
//   FRIENDLY  — Pokémon spawns peacefully, no attack target set, no battle forced
//   CONFLICT  — Pokémon targets the player immediately; battle starts if startBattleOn<X>=true
//   ITEM      — A mob or item reward spawns instead of a battle Pokémon
//
// The three values are RELATIVE weights — they do NOT need to sum to 1 or 100.
// Selection probability = weight / (sum of all three weights).
// Example: friendly=0.60, conflict=0.25, item=0.15  →  60% / 25% / 15%
// Example: friendly=6,    conflict=3,    item=1     →  same result (60/30/10)
// Set a weight to 0.0 to fully disable that mood for this profession.
moodWeightFriendly=0.5
moodWeightConflict=0.35
moodWeightItem=0.15
