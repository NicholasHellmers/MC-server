name: Build Modpack Release & Deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Astral UV
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Setup Python
        run: uv python install 3.11

      - name: Install Dependencies
        run: uv sync --all-extras

      - name: Validate Modpack & Export .mrpack
        run: |
          uv run --all-extras python cicd/build_modpack.py --server-dir server --output Cobblemon-Modpack.mrpack

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: Cobblemon-Modpack.mrpack
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post Discord Announcement
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          if [ -n "$DISCORD_WEBHOOK" ]; then
            uv run --all-extras python cicd/discord_notify.py \
              --version "${{ github.ref_name }}" \
              --release-url "https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}" \
              --server-ip "${SERVER_HOST:-56.124.88.206}"
          else
            echo "DISCORD_WEBHOOK secret not set; skipping Discord announcement."
          fi

      - name: Deploy to Remote AWS Server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          if [ -n "$SERVER_HOST" ] && [ -n "$SERVER_SSH_KEY" ]; then
            echo "$SERVER_SSH_KEY" > server_key.pem
            chmod 600 server_key.pem
            uv run --all-extras python cicd/deploy_server.py \
              --host "$SERVER_HOST" \
              --user "${SERVER_USER:-ubuntu}" \
              --key server_key.pem \
              --remote-dir "/opt/mc-server"
            rm -f server_key.pem
          else
            echo "SERVER_HOST or SERVER_SSH_KEY secrets not set; skipping automated SSH deployment."
          fi
